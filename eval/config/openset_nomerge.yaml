# Same protocol WITHOUT merging duplicate LFW identities (for transparency only)
experiment: openset
gallery_sizes: [100, 500, 1000, all]
nonmated_frac: 0.3
max_probes_per_identity: 10
n_boot: 1000
hist_gallery_size: 1000
seed: 0
# LFW files some people under two names. Same-token names (any order) are merged automatically;
# these spelling variants were found while inspecting the highest-scoring non-mated searches and
# are merged by name only (no face data is used to decide).
merge_duplicate_identities: false
identity_aliases:
  John_Gruden: Jon_Gruden
  Stephen_Ebberharter: Stephan_Eberharter
  Noer_Moeis: Noer_Muis
result_name: openset_lfw_nomerge
records_tag: _nomerge
